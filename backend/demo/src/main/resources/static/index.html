<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot JWT Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Spring Boot JWT & Social Login Demo</h1>

        <!-- Authentication Forms (shown when not logged in) -->
        <div id="auth-forms">
            <div class="tab">
                <button class="tablinks" onclick="openTab(event, 'Login')">Login</button>
                <button class="tablinks" onclick="openTab(event, 'Register')">Register</button>
                <button class="tablinks" onclick="openTab(event, 'Social Login')">Social Login</button>
            </div>

            <div id="Login" class="tabcontent">
                <form id="login-form">
                    <h2>Login</h2>
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
            </div>

            <div id="Register" class="tabcontent">
                <form id="register-form">
                    <h2>Register</h2>
                    <input type="text" id="register-name" placeholder="Name" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit">Register</button>
                </form>
            </div>

            <div id="Social Login" class="tabcontent">
                <h2>Social Login</h2>
                <p>Click the buttons below to log in with your social account.</p>
                <button id="google-login-btn">Login with Google</button>
                <button id="github-login-btn">Login with GitHub</button>
            </div>
        </div>

        <!-- Logged-in UI (shown when logged in) -->
        <div id="logged-in-ui" style="display: none;">
            <div class="user-profile">
                <h2>Profile</h2>
                <p><strong>Email:</strong> <span id="profile-email"></span></p>
                <p><strong>Name:</strong> <span id="profile-name"></span></p>
                <p><strong>Role:</strong> <span id="profile-role"></span></p>
                <p><strong>Active:</strong> <span id="profile-active"></span></p>
                <button id="logout-btn">Logout</button>
            </div>

            <div class="products-section">
                <h2>Products</h2>
                <ul id="products-list"></ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
