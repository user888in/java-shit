spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}        # from environment variable
    password: ${MAIL_PASSWORD}        # App Password, not your Gmail password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000       # 5 seconds to connect
        timeout: 5000                 # 5 seconds per operation
        writetimeout: 5000            # 5 seconds to write

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}    # from environment variable
  auth-token: ${TWILIO_AUTH_TOKEN}      # from environment variable
  phone-number: ${TWILIO_PHONE_NUMBER}  # e.g. +14155552671

app:
  name: OtpSystem
  otp:
    expiry-minutes: 5